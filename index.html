<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>magomeme</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }
        .container {
            text-align: center;
            width: 300px;
        }
        #progressBar {
            width: 100%;
            background-color: #ddd;
            margin-top: 20px;
            position: relative;
        }
        #progressBar div {
            height: 30px;
            width: 0;
            background-color: #4caf50;
            text-align: center;
            line-height: 30px;
            color: white;
            font-weight: bold;
        }
        #result {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        #calculando {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            display: none;
        }
        #startOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
        }
        #startOverlay .overlay-content {
            text-align: center;
            color: white;
        }
        #startOverlay .overlay-content h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        #startOverlay .overlay-content p {
            font-size: 16px;
            opacity: 0.7;
        }
        #startOverlay .play-icon {
            font-size: 64px;
            margin-bottom: 20px;
            display: block;
        }
    </style>
</head>
<body>
    <!-- Overlay para iniciar la musica -->
    <div id="startOverlay" onclick="dismissOverlay()">
        <div class="overlay-content">
            <span class="play-icon">&#9654;</span>
            <h2>magomeme</h2>
            <p>Haz clic para comenzar</p>
        </div>
    </div>

    <div class="container">
        <h1>Piensa en un número</h1>
        <input type="number" id="inputNumber" placeholder="Número" />
        <button onclick="startLoading()">Cargar</button>

        <div id="calculando">Calculando...</div> <!-- Texto de "Calculando..." -->

        <div id="progressBar">
            <div id="progress"></div>
        </div>
        <div id="result"></div>
    </div>

    <!-- Etiqueta de audio -->
    <audio id="loadingMusic">
        <source src ="musica/magomeme.mp3" type="audio/mpeg">
    </audio>

    <!-- Audio de fondo que suena al iniciar -->
    <audio id="bgMusic" loop>
        <source src="musica/magomeme.mp3" type="audio/mpeg">
    </audio>

    <script>
        function dismissOverlay() {
            document.getElementById('startOverlay').style.display = 'none';
            var bgMusic = document.getElementById('bgMusic');
            bgMusic.volume = 0.3;
            bgMusic.play();
        }

        function startLoading() {
            var number = document.getElementById('inputNumber').value;
            if (number === "") {
                alert("Por favor, introduce un número");
                return;
            }

            var progressBar = document.getElementById('progress');
            var calculandoText = document.getElementById('calculando');
            progressBar.style.width = '0%';
            progressBar.innerText = '0%';
            calculandoText.style.display = 'block'; // Muestra el texto "Calculando..."

            var width = 0;
            var duration = 5000; // Duración de 5 segundos
            var intervalTime = 50; // Intervalos de tiempo en milisegundos
            var step = (intervalTime / duration) * 100;

            var audio = document.getElementById('loadingMusic');
            audio.currentTime = 2; // Empieza a reproducir desde el segundo 2
            audio.play(); // Inicia la música

            var interval = setInterval(function() {
                if (width >= 100) {
                    clearInterval(interval);
                    document.getElementById('result').innerText = "El número que pensaste es: " + number;
                    audio.pause(); // Detiene la música
                    calculandoText.style.display = 'none'; // Oculta el texto "Calculando..." cuando termina la carga
                } else {
                    width += step;
                    progressBar.style.width = width + '%';
                    progressBar.innerText = Math.floor(width) + '%';
                }
            }, intervalTime);

            // Detiene la música en el segundo 10
            setTimeout(function() {
                audio.pause();
            }, 5000); // 5000 ms = 5 segundos después de que empieza a reproducir
        }
    </script>
</body>
</html>
